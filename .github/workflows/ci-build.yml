name: ci-build

on:
  push:
    branches:
      - main
      - 'rel/v*'
    paths-ignore:
      - README.md
  pull_request:
    branches:
      - main
    paths-ignore:
      - README.md

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # nuget.org trusted publishing exchanges the GitHub OIDC token for a short-lived API key

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0 # avoid shallow clone so nbgv can do its work.
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          9.0.x
          10.0.x
    - uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: nuget-
    - name: nbgv set version
      uses: dotnet/nbgv@v0.4
      with:
        setAllVars: true
    - run: echo "NBGV_SemVer2 $NBGV_SemVer2"
    - name: Build
      run: dotnet build UnlockedData.Chartist.Blazor.sln --configuration Release
    - name: Unit Tests
      run: dotnet test UnlockedData.Chartist.Blazor.sln --no-build -c Release --verbosity normal
    - name: Build demo and browser tests
      run: dotnet build UnlockedData.Chartist.Blazor.Demo.sln --configuration Release
    - name: Install Playwright Chromium
      run: pwsh test/UnlockedData.Chartist.Blazor.BrowserTests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium
    - name: Browser Tests
      run: dotnet test test/UnlockedData.Chartist.Blazor.BrowserTests/UnlockedData.Chartist.Blazor.BrowserTests.csproj --no-build -c Release --verbosity normal
    - name: Pack
      run: dotnet pack UnlockedData.Chartist.Blazor.sln --no-build -c Release --output "${{ github.workspace }}/package"
    - name: Check package version
      run: test -f "${{ github.workspace }}/package/UnlockedData.Chartist.Blazor.$NBGV_NuGetPackageVersion.nupkg"
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: nuget
        path: ${{ github.workspace }}/package
    - name: NuGet login (trusted publishing)
      id: nuget-login
      if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/rel/v')
      uses: NuGet/login@v1
      with:
        user: ${{ secrets.NUGET_USER }} # nuget.org profile name, not an email address
    - name: Push to NuGet
      if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/rel/v')
      env:
        NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
      run: dotnet nuget push "${{ github.workspace }}/package/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
